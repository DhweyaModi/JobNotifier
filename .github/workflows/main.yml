name: Job Monitor

on:
  schedule:
    # Backup only: the primary trigger is cron-job.org calling workflow_dispatch every 10 min.
    # GitHub's own schedule is best-effort and often delayed. Runs are serialized (see concurrency).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      type:
        description: "Type of jobs to monitor"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - internship
          - newgrad

permissions:
  contents: write

# Serialize runs so cron-job.org + the schedule never scrape/notify/commit seen_jobs.json at once
concurrency:
  group: job-monitor
  cancel-in-progress: false

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verification tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m pytest tests/

      - name: Run monitor (Internships & New Grad)
        env:
          SLACK_WEBHOOK_CANADA: ${{ secrets.SLACK_WEBHOOK_URL_CANADA }}
          SLACK_WEBHOOK_USA: ${{ secrets.SLACK_WEBHOOK_URL_USA }}
          SLACK_WEBHOOK_NEWGRAD_CANADA: ${{ secrets.SLACK_WEBHOOK_URL_NEWGRAD_CANADA }}
          SLACK_WEBHOOK_NEWGRAD_USA: ${{ secrets.SLACK_WEBHOOK_URL_NEWGRAD_USA }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor.py --type "${{ inputs.type || 'all' }}"

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase origin main || true
          git push


