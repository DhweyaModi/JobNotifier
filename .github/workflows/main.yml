name: Job Monitor

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run verification tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m pytest tests/

      - name: Run monitor
        env:
          SLACK_WEBHOOK_CANADA: ${{ secrets.SLACK_WEBHOOK_URL_CANADA }}
          SLACK_WEBHOOK_USA: ${{ secrets.SLACK_WEBHOOK_URL_USA }}
          SLACK_WEBHOOK_NEWGRAD_CANADA: ${{ secrets.SLACK_WEBHOOK_URL_NEWGRAD_CANADA }}
          SLACK_WEBHOOK_NEWGRAD_USA: ${{ secrets.SLACK_WEBHOOK_URL_NEWGRAD_USA }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor.py

      - name: Commit updated seen_jobs.json
        run: |
          git config user.name "job-monitor-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [skip ci]"
          git pull --rebase origin main || true
          git push

